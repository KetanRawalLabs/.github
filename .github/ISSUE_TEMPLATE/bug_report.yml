name: Bug report
description: Report a reproducible defect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include credentials, personal data, or private logs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear summary of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Include app version, operating system, runtime, or browser as relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, personal information, and other secrets before sharing.
